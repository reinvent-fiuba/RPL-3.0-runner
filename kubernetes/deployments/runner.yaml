apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner
spec:
  selector:
    matchLabels:
      app: runner
      tier: backend
      track: stable
  replicas: 1
  strategy:
    type: Recreate #rolling updates are too resource intensive for such a big image. We were randomly getting "out of ephemeral storage" errors
  template:
    metadata:
      labels:
        app: runner
        tier: backend
        track: stable
    spec:
      nodeSelector:
        cloud.google.com/gke-preemptible: "true"
      tolerations:
      - effect: NoSchedule
        key: task
        operator: Equal
        value: preemptive
      containers:
      - name: runner
        image: gcr.io/rpl2-fiuba/rpl-3.0-runner:latest
        ports:
          - name: http-runner
            containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: 300m
            memory: 800Mi  # controlled increases on the limits do not affect our costs
        startupProbe: # by using independent probes we should be able to handle eviction behavior better than before
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 3
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 3
          periodSeconds: 30
          timeoutSeconds: 5
      - name: worker
        image: gcr.io/rpl2-fiuba/rpl-3.0-worker:latest
        env:
        - name: QUEUE_URL
          value: "amqp://guest:guest@queue:5672"
        - name: URL_RPL_BACKEND
          value: "http://rpl-activities-api"
        - name: QUEUE_ACTIVITIES_NAME
          value: hello
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: runner-api-key
              key: runner-api-key
        ports:
          - name: http-worker
            containerPort: 8088
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            cpu: 300m
            memory: 400Mi